name: Build YAMS

on:
  push:
    branches:
      - v2
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # editable install pulls PLASMA (plasma-app[msense] @ git+...) from pyproject.toml;
      # the manylinux pylsl wheel bundles liblsl, so no extra system dep here
      - name: Install
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest

  build-macos:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          activate-environment: yams

      - name: Install dependencies
        shell: bash -el {0}
        run: |
          conda install -c conda-forge liblsl -y
          pip install -e ".[build]"

      - name: Build
        shell: bash -el {0}
        run: pyinstaller app_macos.spec --noconfirm

      - name: Smoke test
        shell: bash -el {0}
        run: |
          BROWSER=/usr/bin/true ./dist/YAMS_MacOS_arm64 > yams-smoke.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:7860/ > /dev/null; then
              echo "YAMS served its UI"
              exit 0
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              cat yams-smoke.log
              echo "Binary exited before serving its UI"
              exit 1
            fi
            sleep 1
          done
          cat yams-smoke.log
          echo "Timed out waiting for YAMS"
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: YAMS-MacOS-arm64
          path: dist/YAMS_MacOS_arm64

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/YAMS_MacOS_arm64

  build-windows:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[build]"

      - name: Build
        run: pyinstaller app_windows.spec --noconfirm

      - name: Smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\YAMS_Windows_x64.exe" -PassThru -RedirectStandardOutput "yams-smoke.log" -RedirectStandardError "yams-smoke.err"
          $ready = $false
          try {
            for ($i = 0; $i -lt 120; $i++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) { throw "YAMS exited with code $($process.ExitCode)" }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:7860/" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) { throw "Timed out waiting for YAMS" }
            Write-Host "YAMS served its UI"
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            if (-not $ready) { Get-Content yams-smoke.err -ErrorAction SilentlyContinue }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: YAMS-Windows-x64
          path: dist/YAMS_Windows_x64.exe

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/YAMS_Windows_x64.exe
